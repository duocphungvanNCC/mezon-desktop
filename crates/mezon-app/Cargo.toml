[package]
name = "mezon-app"
version.workspace = true
edition = "2024"
default-run = "mezon"
authors.workspace = true
license.workspace = true
description = "Mezon desktop - voice, video and text chat"

[[bin]]
name = "mezon"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }
mezon-ui.workspace = true
mezon-store.workspace = true
mezon-native.workspace = true
mezon-updater.workspace = true
mezon-client.workspace = true
dotenvy = "0.15"
flume.workspace = true
reqwest_client.workspace = true
tokio.workspace = true
futures.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
dirs.workspace = true
serde.workspace = true

[build-dependencies]
woff2-patched = "0.4.0"

[package.metadata.deb]
name = "mezon"
maintainer = "Mezon Team"
section = "net"
priority = "optional"
extended-description = "Mezon desktop client (Rust/GPUI) for voice, video and text chat."
assets = [
    ["target/release/mezon", "usr/bin/", "755"],
    ["../../packaging/linux/mezon.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/mezon.png", "usr/share/icons/hicolor/512x512/apps/mezon.png", "644"],
]

